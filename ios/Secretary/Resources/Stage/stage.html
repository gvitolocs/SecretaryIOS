<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Lucina</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  /* The stage takes every gesture (orbit, pinch, taps): no page scroll, no browser zoom. */
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="stage" aria-label="Lucina"></canvas>
<script type="module">
// The iOS host page for packages/lucina-stage. Swift serves this page, the bundle and the
// private model under lucina-app://stage/ (the model and manifest are proxied by Swift
// with the device token, so no token ever reaches this page). Audio plays only when Swift
// asks: the stage starts muted and nothing here plays on its own.
import { createWardrobeStage, FaceSolver } from './lucina-stage.standalone.js';

const post = (type, payload = {}) => {
  try { window.webkit.messageHandlers.lucina.postMessage({ type, ...payload }); } catch (_) { /* not in the app */ }
};
const canvas = document.getElementById('stage');
let stage = null;
let starting = null;
/** Face tracking (ARKit in Swift): calibration and mirroring live in the shared solver. */
let faceSolver = null;

window.lucina = {
  start(opts) {
    if (starting) return starting;
    starting = (async () => {
      try {
        // The wardrobe stage: outfit, hairstyle and hair colour change with the effect.
        const wardrobe = opts.wardrobe || {};
        const look = opts.look || {};
        stage = await createWardrobeStage(canvas, {
          modelUrl: opts.modelUrl,
          wardrobe: wardrobe.outfits || [],
          hairstyles: wardrobe.hairstyles || [],
          hairColors: wardrobe.colors || [],
          outfit: look.outfit || null,
          hair: look.hair || null,
          hairColor: look.hairColor || null,
          assetBase: opts.assetBase,
          manifestUrl: opts.manifestUrl,
          framing: opts.framing || 'bust',
          muted: opts.muted !== false,
          muteStorageKey: null,
          reducedMotion: opts.reducedMotion ?? undefined,
          maxPixelRatio: 2,
          // Drag turns her, pinch zooms, double-tap resets, taps on her react (lucina-stage interact/).
          interactive: opts.interactive !== false,
          onError: (e) => post('error', { message: String((e && e.message) || e) }),
        });
        stage.onStateChange((next) => post('state', { state: next }));
        stage.onChanging((changing) => post('changing', { changing }));
        stage.onOutfitChange((outfit) => post('outfit', { outfit }));
        stage.onHairChange((hair, hairColor) => post('hair', { hair, hairColor }));
        stage.onTouch((e) => post('touch', { region: e.region, line: e.line, reaction: e.reaction, pat: e.pat }));
        post('ready', { placeholder: !!stage.info.placeholder });
      } catch (e) {
        post('error', { message: String((e && e.message) || e), fatal: true });
      }
    })();
    return starting;
  },
  setFraming(f) { stage && stage.setFraming(f); },
  /** Face, bust or full body, keeping the orbit angle. */
  cameraPreset(p) { stage && stage.cameraPreset(p); },
  resetView() { stage && stage.resetView(); },
  setInteractive(on) { stage && stage.setInteractive(!!on); },
  setBackground(id) { stage && stage.setBackground(id); },
  setLighting(id) { stage && stage.setLighting(id); },
  setExpressionHold(e) { stage && stage.setExpression(e || null, 1); },
  gesture(name) { stage && stage.gesture(name); },
  /** Dance; music (the built-in beat) only when Swift says so, after a tap and unmuted. */
  setDance(on, music) { stage && stage.setDance(!!on, music ? { music: true } : {}).catch((e) => post('error', { message: String(e) })); },
  /** Gyro parallax fed by CoreMotion from Swift (degrees), as deviceorientation events. */
  setGyro(on) { stage && stage.setGyro(!!on); },
  tilt(beta, gamma) {
    try { window.dispatchEvent(new DeviceOrientationEvent('deviceorientation', { beta, gamma, alpha: 0 })); } catch (_) { /* old WebKit */ }
  },
  /** Face tracking started (Swift): a fresh calibration, and her face in view. */
  faceStart() {
    faceSolver = new FaceSolver();
    if (stage) stage.cameraPreset('face');
  },
  /**
   * One ARKit face sample: blend-shape coefficients (web names, e.g. eyeBlinkLeft) and the face's 4×4
   * transform relative to the camera (column-major). Only these numbers reach the page, never a frame.
   */
  faceFrame(shapes, matrix) {
    if (!stage) return;
    if (!faceSolver) faceSolver = new FaceSolver();
    stage.setFaceDrive(faceSolver.solve(shapes || {}, matrix || null));
  },
  faceRecenter() { faceSolver && faceSolver.recenter(); },
  faceStop() {
    faceSolver = null;
    stage && stage.setFaceDrive(null);
  },
  /** A ready-made drive ({yaw, pitch, roll, jawOpen, blinkL, blinkR, smile, …}), or null to stop. */
  setFaceDrive(drive) { stage && stage.setFaceDrive(drive || null); },
  /** A PNG of her for the share sheet (posted as a data URL). */
  async snapshot() {
    if (!stage) return;
    try {
      const blob = await stage.snapshot();
      const url = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); });
      post('photo', { dataUrl: url });
    } catch (e) { post('error', { message: 'snapshot: ' + String(e) }); }
  },
  /** Frame stats for profiling (posted as a 'stats' message). */
  stats() { if (stage) post('stats', { stats: stage.stats.snapshot(), view: stage.view }); },
  /** Scripted gestures for device checks (no user needed): orbit, pinch, tap her head twice. */
  async demo() {
    if (!stage) return;
    const touches = [];
    const off = stage.onTouch((e) => touches.push(e.reaction));
    setTimeout(() => { off(); post('demo', { step: 'touches', touches }); }, 30000);
    await new Promise((res) => setTimeout(res, 5000));
    const c = stage.three.renderer.domElement;
    const r = c.getBoundingClientRect();
    const wait = (ms) => new Promise((res) => setTimeout(res, ms));
    const ev = (type, id, x, y) => c.dispatchEvent(new PointerEvent(type, { pointerId: id, pointerType: 'touch', clientX: x, clientY: y, bubbles: true, isPrimary: id === 1 }));
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    ev('pointerdown', 1, cx - 60, cy);
    for (let i = 1; i <= 12; i++) { await wait(16); ev('pointermove', 1, cx - 60 + i * 10, cy + i); }
    ev('pointerup', 1, cx + 60, cy + 12);
    await wait(1500);
    post('demo', { step: 'orbit', view: stage.view });
    stage.cameraPreset('face');
    await wait(1500);
    post('demo', { step: 'face', view: stage.view });
    await wait(5000);
    stage.resetView();
    await wait(5000);
    post('demo', { step: 'reset', view: stage.view });
    // Tap her head twice (a pat): the crown, from her head bone.
    let head = null;
    stage.three.model.traverse((o) => { if (!head && /head[ _]neck[ _]upper|^head$|頭/i.test(o.name)) head = o; });
    if (head) {
      const p = head.getWorldPosition(head.position.clone()); p.y += 0.12; p.project(stage.three.camera);
      const x = r.left + (p.x + 1) / 2 * r.width, y = r.top + (1 - p.y) / 2 * r.height;
      for (let k = 0; k < 2; k++) { ev('pointerdown', 3, x, y); ev('pointerup', 3, x, y); await wait(600); }
    }
  },
  /** Hands over the wardrobe and dresses her (each part is a no-op when it is already on). */
  dress(wardrobe, look) {
    if (!stage) return;
    const w = wardrobe || {};
    const l = look || {};
    const fail = (what) => (e) => post('error', { message: what + ': ' + String((e && e.message) || e) });
    stage.setWardrobe(w.outfits || []);
    stage.setHairstyles(w.hairstyles || [], w.colors || []);
    if (l.outfit && stage.outfit !== l.outfit) stage.setOutfit(l.outfit).catch(fail('outfit'));
    if ((l.hair || 'natural') !== stage.hair) stage.setHair(l.hair || null).catch(fail('hair'));
    if ((l.hairColor || null) !== stage.hairColor) stage.setHairColor(l.hairColor || null).catch(fail('hair colour'));
  },
  setState(s) { stage && stage.setState(s); },
  setMuted(m) { stage && stage.setMuted(!!m); },
  setReducedMotion(r) { stage && stage.setReducedMotion(r); },
  nod() { stage && stage.nod(); },
  setExpression(e, w) { stage && stage.setExpression(e || null, w); },
  stop() { stage && stage.stopSpeaking(); },
  resize() { stage && stage.resize(); },
  /** Fetches audio Swift prepared (same origin) and lip-syncs it. */
  async speak(url) {
    if (!stage) return;
    try {
      const response = await fetch(url);
      if (!response.ok) throw new Error('audio ' + response.status);
      const data = await response.arrayBuffer();
      await stage.unlockAudio();
      await stage.speak(data);
    } catch (e) {
      post('error', { message: String((e && e.message) || e) });
    } finally {
      post('spoken');
    }
  },
};
post('loaded');
</script>
</body>
</html>
