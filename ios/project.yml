name: Secretary
options:
  bundleIdPrefix: tech.getsecretary
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  Secretary:
    type: application
    platform: iOS
    sources:
      - path: Secretary
        excludes:
          - "Info.plist"
    info:
      path: Secretary/Info.plist
      properties:
        CFBundleDisplayName: Secretary
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, it, da]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: AccentColor
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # Only plain-HTTP to local hosts (the dev mock); everything else must be HTTPS.
        NSHealthShareUsageDescription: "Lucina reads your weight, workouts, steps and sleep so the Weight tab stays complete and she knows how you are doing."
        NSHealthUpdateUsageDescription: "Your weigh-ins and gym workouts are saved to Apple Health."
        NSLocationWhenInUseUsageDescription: "Lucina learns which places you visit, so she can remind you of things where they matter."
        NSLocationAlwaysAndWhenInUseUsageDescription: "To notice when you arrive at or leave a place, even when Secretary is closed."
        NSCalendarsFullAccessUsageDescription: "Lucina sees your upcoming events and adds or removes them when you ask."
        NSRemindersFullAccessUsageDescription: "Lucina adds, completes and reads your reminders when you ask."
        NSAlarmKitUsageDescription: "Lucina sets alarms and timers for you when you ask."
        NSSupportsLiveActivities: true
        SecretaryKeychainGroup: "$(AppIdentifierPrefix)tech.getsecretary.shared"
        NSMicrophoneUsageDescription: "Lucina listens when you tap the microphone, so you can talk to her instead of typing."
        NSSpeechRecognitionUsageDescription: "Your words are turned into text so Lucina can answer them."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Notifications (docs/notifications.md): background refresh syncs the inbox and the
        # local schedules. APNs stays off on the free Personal Team; with a paid team set
        # SecretaryAPNsEnabled to true and add aps-environment to Secretary.entitlements.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [tech.getsecretary.app.refresh]
        SecretaryAPNsEnabled: false
    dependencies:
      # Built by scripts/build-ios-core.sh (gitignored): the Rust gym/body engines.
      - framework: Frameworks/SecretaryCore.xcframework
        embed: false
      - target: SecretarySafari
      - target: SecretaryScreenTimeReport
      - target: SecretaryScreenTimeMonitor
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.getsecretary.app
        PRODUCT_NAME: Secretary
        CODE_SIGN_ENTITLEMENTS: Secretary/Secretary.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
  SecretarySafari:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/SecretarySafari
        excludes: ["WebExtension/**", "Info.plist"]
      # The web extension's files sit at the appex root (no top-level "Resources" folder:
      # iOS bundles are flat); _locales and images keep their structure.
      - path: Extensions/SecretarySafari/WebExtension/manifest.json
        buildPhase: resources
      - path: Extensions/SecretarySafari/WebExtension/background.js
        buildPhase: resources
      - path: Extensions/SecretarySafari/WebExtension/content.js
        buildPhase: resources
      - path: Extensions/SecretarySafari/WebExtension/_locales
        type: folder
      - path: Extensions/SecretarySafari/WebExtension/images
        type: folder
      - path: Extensions/Shared
      - path: Secretary/Core/Keychain.swift
    info:
      path: Extensions/SecretarySafari/Info.plist
      properties:
        CFBundleDisplayName: Secretary
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        SecretaryKeychainGroup: "$(AppIdentifierPrefix)tech.getsecretary.shared"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).SafariWebExtensionHandler"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.getsecretary.app.safari
        PRODUCT_NAME: SecretarySafari
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: Extensions/SecretarySafari/SecretarySafari.entitlements
  SecretaryScreenTimeReport:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Extensions/SecretaryScreenTimeReport
        excludes: ["Info.plist"]
    dependencies:
      - sdk: DeviceActivity.framework
    info:
      path: Extensions/SecretaryScreenTimeReport/Info.plist
      properties:
        CFBundleDisplayName: Secretary Screen Time
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivityui.report-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.getsecretary.app.screentime-report
        PRODUCT_NAME: SecretaryScreenTimeReport
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: Extensions/SecretaryScreenTimeReport/SecretaryScreenTimeReport.entitlements
  SecretaryScreenTimeMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/SecretaryScreenTimeMonitor
        excludes: ["Info.plist"]
      - path: Extensions/Shared
      - path: Secretary/Core/Keychain.swift
    dependencies:
      - sdk: DeviceActivity.framework
    info:
      path: Extensions/SecretaryScreenTimeMonitor/Info.plist
      properties:
        CFBundleDisplayName: Secretary Screen Time Monitor
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        SecretaryKeychainGroup: "$(AppIdentifierPrefix)tech.getsecretary.shared"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).SecretaryScreenTimeMonitor"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.getsecretary.app.screentime-monitor
        PRODUCT_NAME: SecretaryScreenTimeMonitor
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: Extensions/SecretaryScreenTimeMonitor/SecretaryScreenTimeMonitor.entitlements
  SecretaryTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SecretaryTests]
    dependencies:
      - target: Secretary
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: tech.getsecretary.app.tests
  SecretaryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SecretaryUITests]
    dependencies:
      - target: Secretary
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: tech.getsecretary.app.uitests
        TEST_TARGET_NAME: Secretary
schemes:
  Secretary:
    build:
      targets:
        Secretary: all
        SecretaryTests: [test]
        SecretaryUITests: [test]
    run:
      config: Debug
      commandLineArguments:
        "-SecretaryBaseURL http://localhost:8791": false
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - SecretaryTests
        - SecretaryUITests
  SecretaryUnit:
    build:
      targets:
        Secretary: all
        SecretaryTests: [test]
    test:
      config: Debug
      targets:
        - SecretaryTests
