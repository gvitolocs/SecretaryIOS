# Upstream registry: every original project Lucina ported, rebuilt, forked or vendored.
# Read weekly by `lucina-rs upstream check` (docs/upstream-watch.md) from origin/main, so an edit here applies
# once it is merged to main; no redeploy needed. Porting rules: docs/porting-guidelines.md.
# Inventory made 2026-11-01 from SecretaryIOS, LucinaAndroidOS (references/upstream.lock,
# docs/research/integration-decisions.md), lucinaos, lucinaos-kernel, lucina-cua, lucinadesk, SecretaryCode and notes.
#
# [[upstream]] keys:
#   id               kebab-case, unique
#   name             human name used in Lucina's message
#   url              upstream home (web)
#   source           github | git | debian | frozen | manual
#   repo             github only: "owner/name"
#   branch           upstream branch to compare against (github/git), default "main"
#   track            github only: releases | tags | commits (default releases)
#   pin              the release tag or commit we are based on; commits/releases after it are "new"
#   pin_date         YYYY-MM-DD; used when there is no exact pin (commits since that date)
#   paths            optional: only upstream changes touching these paths count
#   local            git only: a clone on nezopt to `git log` (instead of url + ls-remote)
#   package, suite   debian only: source package and suite to watch
#   check_hint       manual only: what to look at by hand
#   notify           auto (default: ask the owner when significant) | report (weekly report only, never ask)
#   ours             [{ repo = "<nezopt path>", path = "<dir in it>", base = "origin/main" }]: our counterpart;
#                    the first one gets the porting workspace (base = the branch it is cut from)
#   licence_upstream / licence_ours   SPDX ids ("unknown" when not checked)
#   relation         port (reimplemented in Rust) | fork | vendored | reference
#   confidence       confirmed | likely | unconfirmed (and say why in notes)
#   rely_on          features of the upstream we depend on (JEV checks if changes touch them)
#   notes            evidence and caveats
# [[upstream.contrib]]: our improvements the upstream lacks (reverse direction; draft only, never pushed without
#   the owner's OK): id, title, ours, upstream_target, notes, status = candidate | asked | drafting | offered | sent | declined

[settings]
notify_min_importance = 3
security_min = 0.5
max_decisions_per_run = 3
max_contrib_per_run = 1
auto_run = false
data_dir = "/home/nez/Projects/Lucina/data/upstream-watch"

