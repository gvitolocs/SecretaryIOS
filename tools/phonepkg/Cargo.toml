[package]
name = "phonepkg"
version = "0.1.0"
edition = "2021"
publish = false
description = "Over-the-air app manager for the owner's Samsung S20 FE: drives adb over Tailscale."

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Standalone: not a member of the Rust workspace, so it builds without the workspace's deps.
[workspace]
