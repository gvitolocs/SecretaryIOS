[package]
name = "lan-cert"
version = "0.1.0"
edition = "2021"
publish = false
description = "Keeps the home-network host of Lucina live view (lan.getsecretary.tech) resolvable and certified."

# Standalone: not a member of the Rust workspace, so the ACME client stays out of lucina-server.
[workspace]

[dependencies]
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "hyper-rustls", "rcgen"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1"
anyhow = "1"
