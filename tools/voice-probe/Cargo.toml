[package]
name = "voice-probe"
version = "0.1.0"
edition = "2021"
publish = false
description = "Measures voice latency against Secretary (voice socket, docs/lucinavoice-protocol.md 2+10, and the old /v1/share path, docs/share.md)."

# Standalone: not a member of the Rust workspace, so it builds without the workspace's deps.
[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# tokio-tungstenite's WebSocketStream only exposes send/read through the futures Sink/Stream traits.
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }
