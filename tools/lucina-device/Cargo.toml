[package]
name = "lucina-device"
version = "0.2.0"
edition = "2021"
[workspace]
[lib]
crate-type = ["rlib","cdylib"]
[[bin]]
name = "lucina-device"
path = "src/main.rs"
required-features = ["host"]
[features]
default = ["host"]
host = ["dep:ureq","dep:rustls-graviola","dep:wait-timeout","dep:tiny_http","dep:sha2","dep:serde_yaml","dep:fs2"]
android = ["dep:jni"]
android-network = ["android","dep:ureq","dep:rustls-graviola"]
[dependencies]
serde = {version="1",features=["derive"]}
serde_json = "1"
regex = "1"
base64 = "0.22"
ureq = {version="=3.4.2",default-features=false,features=["rustls-no-provider","rustls-webpki-roots","json"],optional=true}
rustls-graviola = {version="=0.3.4",default-features=false,optional=true}
wait-timeout = {version="0.2",optional=true}
tiny_http = {version="0.12",optional=true}
sha2 = {version="0.10",optional=true}
serde_yaml = {version="0.9",optional=true}
fs2 = {version="0.4",optional=true}
jni = {version="0.21",default-features=false,optional=true}
[profile.release]
strip = true
lto = "thin"
