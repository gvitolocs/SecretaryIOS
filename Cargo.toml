[workspace]
resolver = "2"
members = [
    "crates/ink-library",
    "crates/ink-sync",
    "crates/ink-cli",
    "crates/ink-obsidian",
    "crates/ink-kindle-hal",
    "crates/ink-render",
    "crates/ink-epub",
    "apps/desktop-preview",
    "crates/secretary-core",
    "crates/secretary-server",
    "crates/secretary-gym",
    "crates/secretary-body",
    "crates/secretary-ffi",
    "crates/lucina-secrets",
    "crates/lucina-llm",
    "crates/lucina-store",
    "crates/lucina-memory",
    "crates/lucina-grocery",
    "crates/lucina-deals",
    "crates/lucina-delegate",
    "crates/lucina-agents",
    "crates/lucina-agentd",
    "crates/lucina-tools",
    "crates/lucina-discord",
    "crates/lucina-intent",
    "crates/lucina-server",
    "crates/lucina-telegram",
    "crates/lucina-meshy",
    "crates/secretary-mcp",
    "crates/secretary-calendar",
    "crates/lucina-proactive",
    "crates/lucina-phone-core",
    "crates/lucina-otp-relay",
    "crates/lucina-android",
    "crates/lucina-android-calls",
    "crates/lucina-memo",
    "crates/nclient-core",
    "crates/secretary-nclient",
    "crates/lucina-diagnostics",
    "crates/secretary-tasks",
    "crates/secretary-player",
    "crates/secretary-player-wasm",
    "crates/secretary-maps",
    "verification/models",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
fs4 = "0.13"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
csv = "1"
sha2 = "0.10"
async-trait = "0.1"
tracing = "0.1"
futures-util = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Argon2 (password login) is unbearably slow unoptimized; tests hash for real.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

# The model checkers explore millions of states: optimise them in test builds too.
[profile.dev.package.verification-models]
opt-level = 3
[profile.dev.package.stateright]
opt-level = 3
[profile.dev.package.dashmap]
opt-level = 3
[profile.dev.package.ahash]
opt-level = 3
