\* MUST PASS: the status scenario at the Stateright bounds (I1: drop, duplicate, crash, spurious timeout)
SPECIFICATION Spec
CONSTANTS
    Scenario = "status"
    Drops = 1
    Dups = 1
    Crashes = 1
    SpuriousTimeouts = 1
    OwnerActs = TRUE
    Gate = TRUE
    DurableAcks = TRUE
    StatusRules = TRUE
INVARIANTS
    AckedNeverLost
    NeverResendAcked
    AppliedAtMostOnce
    OwnerCompletedNeverReverted
    DeviceCompletedSticky
    HighlightsOnlyGrow
    Converges
PROPERTIES
    EventuallyAllApplied
CHECK_DEADLOCK FALSE
