# SecretaryIOS pipeline rules (lucina-agentd reads this from main, never from the branch being merged).
# Format and defaults: crates/lucina-agentd/src/pipeline/repo.rs; workflow: docs/repo-workflow.md.
trunk = "main"

[merge]
# Fast gates (owner, 2026-11-01): diffgate, then `cargo check --workspace` and the touched standalone
# crates. The session runs the tests in its workspace before merging; `lagent merge --full` runs them here,
# and cargo = "touched" makes that the default again.
diffgate = true
cargo = "check"
timeout_min = 45
# Standalone crates (tools/*, crates/secretary-{instagram,pixiv}, firmware/lucinavoice-core, ...) are
# built through --manifest-path when touched. These use other toolchains and are left alone:
skip = ["firmware/lucinavoice"]
# The worker sandbox (docs/design/agents-sandbox.md): its policy, its generator and their tests. Loosening any of them
# is a gate change.
gate_files = [
    "deploy/lucina-agentd/sandbox-policy.toml",
    "crates/lucina-agents/src/sandbox.rs",
    "crates/lucina-agents/src/sandbox/",
    "crates/lucina-agents/tests/sandbox_host.rs",
    "crates/lucina-delegate/tests/sandbox_parity.rs",
]

# The Verus proofs run on GitHub Actions, one proof unit per runner (docs/ci/VERUS.md). A branch that reaches a proof unit must be
# pushed (git push origin <branch>) and have verus-gate green on its exact commit; one that reaches none passes. Never reruns proofs.
[[gate]]
name = "proofs green on GitHub"
paths = []
run = "bash scripts/gate-github-checks.sh"
timeout_min = 5

# The fast local check on the merged result: only what the change touched, capped (docs/ci/SHIFT-LEFT.md). The queue is shared,
# so a step is capped at 180 s at the merge, and a step past its limit FAILS the merge (it is never skipped).
[[gate]]
name = "fast local check"
paths = []
run = "bash scripts/check-fast --base HEAD^1 --merge-gate"
timeout_min = 12

# The deploy scripts' own tests (deploy/**/test-*.sh): a stub systemctl and curl, nothing installed,
# started or stopped. check-fast shellchecks those files but runs no test, so without this a watchdog
# rule that no longer watches anything merges green. The launcher refuses when it finds no test at all.
[[gate]]
name = "deploy shell tests"
paths = ["deploy/", "scripts/check-deploy-sh.sh"]
run = "sh scripts/check-deploy-sh.sh"
timeout_min = 5

# `lagent deploy <runtime>`: from main's tip, inside the merge lock, between deploy-guard check and record.
# Runtimes without a recipe still deploy by hand (docs/repo-workflow.md, "Deploying").
[deploy.lucina-agentd]
# A restart interrupts running agents: refuse while any runs (--force overrides).
build = "bash deploy/lucina-agentd/no-running-agents.sh"
install = "deploy/lucina-agentd/install.sh"
timeout_min = 30

[deploy.lucina-rs]
# install.sh builds lucina-server, installs it, restarts lucina-rs and checks /health.
install = "deploy/lucina-rs/install.sh"
timeout_min = 40

[deploy.lucina-memo]
# install.sh builds lucina-memo, installs it and restarts the unit.
install = "deploy/lucina-memo/install.sh"
timeout_min = 30

[deploy.secretary-server]
build = "CC_x86_64_unknown_linux_musl=gcc cargo build --release --target x86_64-unknown-linux-musl -p secretary-server"
install = "bash deploy/p1/install-binary.sh secretary-server"
timeout_min = 30

[deploy.secretary-mcp]
build = "CC_x86_64_unknown_linux_musl=gcc cargo build --release --target x86_64-unknown-linux-musl -p secretary-mcp"
install = "bash deploy/p1/install-binary.sh secretary-mcp"
timeout_min = 30

[deploy.web]
build = "(cd packages/lucina-stage && npm ci --no-audit --no-fund && npm run -s build) && (cd web && npm ci --no-audit --no-fund && npm run -s build)"
install = "bash deploy/p1/install-web.sh"
timeout_min = 30

[deploy.lucina-media]
# install.sh builds lucina-media, installs it, restarts the unit and checks /healthz.
install = "deploy/lucina-media/install.sh"
timeout_min = 30
