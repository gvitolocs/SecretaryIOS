# Lucina secrets skill: ~/.config/lucina-rs/secrets.toml on nezopt
# (LUCINA_SECRETS_CONFIG, set by the drop-in that store-identity.sh writes).
#
# NO VALUES in this file, ever. Values live in Infisical; the machine
# identity's client id and secret are systemd credentials (encrypted).
# See docs/lucina-rust/SECRETS.md.

[infisical]
url = "https://secrets.pokoin.com"
api = "v4"                      # "v3" if the server is older
# organization_slug = "pokoin"  # only if the identity belongs to several orgs
client_id_credential = "lucina-infisical-client-id"
client_secret_credential = "lucina-infisical-client-secret"
timeout_secs = 10

# Alias used in secret refs -> Infisical project id (Project Settings -> Project ID).
[projects]
lucina = "PUT-THE-LUCINA-PROJECT-ID-HERE"

# The ONE folder Lucina may read. The machine identity is read-only on exactly
# this folder in Infisical; Lucina enforces the same scope before any call.
[scope]
project = "lucina"
environment = "prod"
path = "/lucina"

[cache]
ttl_secs = 600                  # values stay in memory at most 10 minutes

[policy]
min_value_len = 8               # shorter values cannot be redacted safely
# deny = ["password", "pwd", "passphrase", "pin", "pincode", "passcode", "adgangskode", "kodeord", "parola"]
extra_deny = []
# A service password a tool really needs, by exact name (never login/sudo/root):
allow_names = []

[audit]
path = "/home/nez/.local/state/lucina-rs/secrets-audit.jsonl"
keep = 500

[redaction]
preload = true                  # learn every value in the folder at start (digests only)

# Tool settings -> secret refs: secret://<project>/<env>/<path>#<KEY>
[refs]
# "weather.api_key" = "secret://lucina/prod/lucina#OPEN_METEO_API_KEY"
