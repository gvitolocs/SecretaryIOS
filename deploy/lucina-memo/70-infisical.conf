# Lucina's own DeepSeek key (Infisical lucina/prod/lucina#DEEPSEEK_API_KEY_LUCINA) from
# infisical-brokerd, bound to this unit (caller svc-lucina-memo), with an encrypted offline
# copy in the broker. lucina.env no longer sets DEEPSEEK_KEY_FILE (2026-10-27).
[Service]
ExecStart=
ExecStart=/usr/local/bin/infisical-broker exec --token-file %h/.config/infisical-mcp/svc-lucina-memo.token --env DEEPSEEK_API_KEY=secret://lucina/prod/lucina#DEEPSEEK_API_KEY_LUCINA -- %h/.local/bin/lucina-memo serve
