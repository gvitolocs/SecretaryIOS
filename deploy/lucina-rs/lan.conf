# lucina-rs.service.d/80-lan.conf: the home-network door to the live view (src/lan.rs).
# Needs the certificate from lucina-lan-cert and, on nezopt, a UFW rule letting the LAN reach the port:
#   sudo ufw allow from 192.168.178.0/24 to any port 9443 proto tcp comment "Lucina live view LAN door"
[Service]
Environment=LUCINA_LAN_BIND=0.0.0.0:9443
Environment=LUCINA_LAN_URL=https://lan.getsecretary.tech:9443
