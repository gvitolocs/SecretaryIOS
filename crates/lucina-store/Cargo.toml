[package]
name = "lucina-store"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lucina's file stores: owner timeline (JSONL), reminders, jobs; Node-compatible formats"

[dependencies]
fs4 = { workspace = true }
lucina-secrets = { path = "../lucina-secrets", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
chrono = { workspace = true }
chrono-tz = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
fancy-regex = "0.19"
getrandom = "0.3"
base64 = "=0.22.1"

[dev-dependencies]
proptest = "1"
tempfile = "3"
