[package]
name = "lucina-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Rust Lucina: /api/secretary/* (identical to the Node contract), chat turns, agenda, SSE"

[lib]
path = "src/lib.rs"

[[bin]]
name = "lucina"
path = "src/main.rs"

[dependencies]
getrandom = "0.3"
zeroize = "=1.9.1"
lucina-telegram = { path = "../lucina-telegram" }
lucina-secrets = { path = "../lucina-secrets" }
lucina-llm = { path = "../lucina-llm" }
lucina-store = { path = "../lucina-store" }
lucina-memory = { path = "../lucina-memory" }
lucina-grocery = { path = "../lucina-grocery" }
lucina-deals = { path = "../lucina-deals" }
lucina-tools = { path = "../lucina-tools" }
lucina-meshy = { path = "../lucina-meshy" }
lucina-delegate = { path = "../lucina-delegate" }
lucina-computer-use = { path = "../lucina-computer-use" }
lucina-intent = { path = "../lucina-intent" }
lucina-phone-core = { path = "../lucina-phone-core" }
lucina-discord = { path = "../lucina-discord", features = ["gateway"] }
axum = { version = "0.8", features = ["multipart"] }
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { workspace = true }
tokio-stream = "0.1"
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
subtle = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
async-trait = { workspace = true }
sha2 = { workspace = true }
regex = "1"
reqwest = { workspace = true }

libc = "0.2"
base64 = "=0.22.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
lopdf = "0.38"
pdf-extract = "0.10"
scraper = "0.24"
tempfile = "3"
lucina-memo = { path = "../lucina-memo" }
rusqlite = { version = "0.32", features = ["bundled"] }
calamine = "0.30"
tar = "0.4"
flate2 = "1"

[dev-dependencies]
secretary-core = { path = "../secretary-core" }
secretary-server = { path = "../secretary-server" }
reqwest = { workspace = true, features = ["stream", "multipart"] }
wiremock = "0.6"
