[package]
name = "lucina-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Rust Lucina: /api/secretary/* (identical to the Node contract), chat turns, agenda, SSE"

[lib]
path = "src/lib.rs"

[[bin]]
name = "lucina"
path = "src/main.rs"

[dependencies]
lucina-secrets = { path = "../lucina-secrets" }
lucina-llm = { path = "../lucina-llm" }
lucina-store = { path = "../lucina-store" }
lucina-memory = { path = "../lucina-memory" }
lucina-grocery = { path = "../lucina-grocery" }
lucina-tools = { path = "../lucina-tools" }
lucina-meshy = { path = "../lucina-meshy" }
lucina-delegate = { path = "../lucina-delegate" }
lucina-intent = { path = "../lucina-intent" }
lucina-discord = { path = "../lucina-discord", features = ["gateway"] }
axum = "0.8"
tokio = { workspace = true }
tokio-stream = "0.1"
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
subtle = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
async-trait = { workspace = true }
sha2 = { workspace = true }
regex = "1"
reqwest = { workspace = true }

[dev-dependencies]
secretary-core = { path = "../secretary-core" }
secretary-server = { path = "../secretary-server" }
reqwest = { workspace = true, features = ["stream"] }
tempfile = "3"
wiremock = "0.6"
base64 = "=0.22.1"
