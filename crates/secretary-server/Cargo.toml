[package]
name = "secretary-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Thin authenticated gateway between the Secretary iOS app and Lucina"

[lib]
path = "src/lib.rs"

[[bin]]
name = "secretary-server"
path = "src/main.rs"

[dependencies]
secretary-core = { path = "../secretary-core" }
axum = "0.8"
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
tower-http = { version = "0.6", features = ["catch-panic", "sensitive-headers"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
subtle = "2"
base64 = "0.22"
getrandom = "0.3"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
