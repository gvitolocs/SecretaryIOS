[package]
name = "ink-epub"
description = "DRM-free EPUB, TXT and Markdown to a simplified block model for the Lucina Ink reader"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
# Same versions as ink-library (already in Cargo.lock).
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
quick-xml = "0.38.4"
encoding_rs = "0.8"
