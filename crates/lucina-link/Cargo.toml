[package]
name = "lucina-link"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lucina Link: probe the routes to each Lucina/Secretary service (LAN, tailnet, public, Cloudflare, SSH jump) and pick the best one"

[lib]
path = "src/lib.rs"

[[bin]]
name = "lucina-link"
path = "src/main.rs"

[features]
default = ["https"]
# HTTPS health probes and the Cloudflare Access probe. Without it, https routes probe as a TCP connect to :443.
https = ["dep:ureq"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { version = "=1.1.6", default-features = false, features = ["parse", "serde"] }
# No async runtime: probes are plain threads, so the client stays small enough for the Kindle.
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"], optional = true }
