[package]
name = "secretary-instagram"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The owner's Instagram viewer plugin: HTTP around instarust-core, signed media URLs, a disk cache with a size cap, save to lucina-media"

# Standalone: its path dependency (instarust) exists only on nezopt, so this crate is NOT a member
# of the root workspace and has its own Cargo.lock.
[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "secretary-instagram"
path = "src/main.rs"

[dependencies]
instarust-core = { path = "/home/nez/Projects/ReverseEngineering/instarust/core" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
subtle = "2"
getrandom = "0.3"
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
