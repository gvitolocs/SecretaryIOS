[package]
name = "lucina-meshy"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Meshy AI 3D for Lucina: REST client, plans with credit costs, budget, background pipeline, gallery, turntable previews"

[lib]
path = "src/lib.rs"

[[bin]]
name = "meshy-mock"
path = "src/bin/meshy-mock.rs"

[dependencies]
lucina-store = { path = "../lucina-store" }
lucina-secrets = { path = "../lucina-secrets" }
axum = "0.8"
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
base64 = "0.22"
schemars = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
