[package]
name = "lucina-media"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lucina media library: photo/video/audio catalog, phone backup ingest, thumbnails, albums, search"

[lib]
path = "src/lib.rs"

[[bin]]
name = "lucina-media"
path = "src/main.rs"

[dependencies]
secretary-media-stream = { path = "../secretary-media-stream" }
# The photo editor: the edit list and its renderer, the same code the web editor previews with.
secretary-image = { path = "../secretary-image" }
# Spreadsheets: view and edit .xlsx without losing parts (`sheet.rs`, docs/xlsx.md).
secretary-xlsx = { path = "../secretary-xlsx" }
# Smart search: SigLIP2 image vectors and their index (`smart.rs`).
lucina-media-ml = { path = "../lucina-media-ml" }
axum = "0.8"
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["fs"] }
tower = { version = "0.5", features = ["util"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
blake3 = "1"
sha2 = { workspace = true }
nom-exif = "3"
reverse_geocoder = "4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "tiff", "bmp"] }
futures-util = "0.3"
# The Lab tells the owner through secretary-server and Telegram.
reqwest = { workspace = true }
subtle = "2"
mime_guess = "2"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
thumbhash = "0.1"
base64 = "0.22"
# Album share tokens (16 bytes from the OS RNG) and the share page's CSP nonce.
getrandom = "0.3"
# Background uploads (`bgupload.rs`): its own HTTP/1.1 listener, which can send a 104 first.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
# The Drive: archive listings, code highlighting, PDF text (pure Rust).
tar = "0.4"
flate2 = "1"
sevenz-rust = { version = "0.6", default-features = false }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
pdf-extract = "0.9"
# JPEG XL renditions (libjxl built from source; nezopt has no libjxl headers).
jpegxl-rs = { version = "0.16", features = ["vendored"] }
jpegxl-sys = { version = "=0.13.0", features = ["vendored"] }
# CPU time of a thread, for the archive-jxl measurements (load-independent timings).
libc = "0.2"

[dev-dependencies]
tempfile = "3"
secretary-xlsx = { path = "../secretary-xlsx" }
http-body-util = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Palette PNGs for the archive tests (the image crate cannot write them).
png = "0.18"
