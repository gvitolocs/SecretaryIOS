[package]
name = "lucina-media"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lucina media library: photo/video/audio catalog, phone backup ingest, thumbnails, albums, search"

[lib]
path = "src/lib.rs"

[[bin]]
name = "lucina-media"
path = "src/main.rs"

[dependencies]
secretary-media-stream = { path = "../secretary-media-stream" }
axum = "0.8"
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["fs"] }
tower = { version = "0.5", features = ["util"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
blake3 = "1"
nom-exif = "3"
reverse_geocoder = "4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "tiff"] }
futures-util = "0.3"
subtle = "2"
mime_guess = "2"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
thumbhash = "0.1"
base64 = "0.22"
# The Drive: archive listings, code highlighting, PDF text (pure Rust).
tar = "0.4"
flate2 = "1"
sevenz-rust = { version = "0.6", default-features = false }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
pdf-extract = "0.9"
# JPEG XL renditions (libjxl built from source; nezopt has no libjxl headers).
jpegxl-rs = { version = "0.16", features = ["vendored"] }
jpegxl-sys = { version = "=0.13.0", features = ["vendored"] }

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
