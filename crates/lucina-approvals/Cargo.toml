[package]
name = "lucina-approvals"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Owner approvals for Lucina: the secretary-server approvals client, Ed25519 grant verification, single-use registry, and the approved root-command path"

[lib]
path = "src/lib.rs"

[[bin]]
name = "lucina-root"
path = "src/bin/lucina-root.rs"

[features]
# An in-process mock approvals server (axum) that signs grants, for tests.
testing = ["dep:axum", "dep:tempfile"]

[dependencies]
axum = { version = "0.8", optional = true }
base64 = "=0.22.1"
chrono = { workspace = true }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
reqwest = { workspace = true }
ring = "0.17"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { version = "3", optional = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
lucina-approvals = { path = ".", features = ["testing"] }
tempfile = "3"
