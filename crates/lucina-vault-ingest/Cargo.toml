[package]
name = "lucina-vault-ingest"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lucina's Obsidian ingest: ops records, commits and session reports become Zettelkasten notes, written with the local Qwen only while it is free"

[dependencies]
lucina-ops = { path = "../lucina-ops" }
lucina-secrets = { path = "../lucina-secrets", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
async-trait = { workspace = true }
regex = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
