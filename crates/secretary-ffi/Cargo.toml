[package]
name = "secretary-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "C ABI static library for the Secretary iOS app"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
secretary-gym = { path = "../secretary-gym" }
secretary-body = { path = "../secretary-body" }
secretary-player = { path = "../secretary-player" }
secretary-image = { path = "../secretary-image" }
secretary-chat = { path = "../secretary-chat" }
serde_json.workspace = true
serde.workspace = true

[dev-dependencies]
thumbhash = "0.1"
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"
